# Builds the macOS (.dmg) and Windows (.exe) apps.
#  - Push a tag like v1.0.0 (or publish a GitHub Release with a new v* tag):
#    installers are built and attached to that release.
#  - Or run it by hand from the Actions tab: installers appear as a
#    downloadable artifact on the run page.
name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build tools
        run: npm ci
      - name: Run calculator tests
        run: npm test
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
